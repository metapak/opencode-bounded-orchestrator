name: Feature request
description: Suggest one bounded, provider-neutral improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes: { label: Problem, description: What concrete workflow problem should this solve? }
    validations: { required: true }
  - type: textarea
    attributes: { label: Proposed behavior, description: Describe the result without assuming a model is available. }
    validations: { required: true }
